# MIT License (c) 2026 kj-devvixon

# Server Configuration
[server]
port = 8080
host = localhost
max_connections = 10

# Test Configuration
[tests]
# Default test duration in seconds
default_duration = 60

# Maximum test duration in seconds
max_duration = 3600

# CPU Test Configuration
[cpu_test]
# Number of iterations per loop
iterations = 100000

# Enable hyperthreading for multi-core test
use_hyperthreading = true

# RAM Test Configuration
[ram_test]
# Block size in MB
block_size = 50

# Maximum number of blocks to keep in memory
max_blocks = 10

# Enable memory sorting (more intensive)
enable_sorting = true

# GPU Test Configuration
[gpu_test]
# Render resolution (width x height)
render_width = 1920
render_height = 1080

# Target FPS for GPU test
target_fps = 60

# Enable shader compilation stress
enable_shaders = true

# Monitoring Configuration
[monitoring]
# Statistics collection interval in milliseconds
stats_interval = 500

# Enable temperature monitoring (requires permissions)
enable_temperature = true

# Enable CPU frequency monitoring
enable_frequency = true

# Safety Configuration
[safety]
# Maximum safe CPU temperature in Celsius
max_safe_temp = 85

# Auto-stop test if temperature exceeds limit
auto_stop_on_overheat = true

# Warning temperature in Celsius
warning_temp = 75

# Logging Configuration
[logging]
# Enable logging to file
enable_file_logging = false

# Log file path
log_file = /var/log/stress-test.log

# Log level: debug, info, warning, error
log_level = info

# UI Configuration
[ui]
# Enable dark mode
dark_mode = false

# Update interval for graphs in milliseconds
graph_update_interval = 1000

# Maximum data points to display in graphs
max_graph_points = 100

# Notes:
# - Some options may require application restart to take effect
# - Temperature monitoring requires appropriate permissions on Linux
# - GPU testing requires OpenGL/Vulkan support
# - Modify with caution - incorrect values may cause crashes
